<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECMS - Student Enrollment System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Student Enrollment & Course Management System</h1>
        <p>SECMS</p>
    </header>

    <nav>
        <button onclick="showSection('dashboard')">Dashboard</button>
        <button onclick="showSection('students')">Students</button>
        <button onclick="showSection('courses')">Courses</button>
        <button onclick="showSection('instructors')">Instructors</button>
        <button onclick="showSection('enrollments')">Enrollments</button>
    </nav>

    <!-- Dashboard -->
    <section id="dashboard" class="section active">

        <h2>Dashboard</h2>

        <div class="cards">

            <div class="card">
                <h3>Students</h3>
                <p id="studentCount">0</p>
            </div>

            <div class="card">
                <h3>Courses</h3>
                <p id="courseCount">0</p>
            </div>

            <div class="card">
                <h3>Instructors</h3>
                <p id="instructorCount">0</p>
            </div>

            <div class="card">
                <h3>Enrollments</h3>
                <p id="enrollmentCount">0</p>
            </div>

        </div>

    </section>


    <!-- Students -->
    <section id="students" class="section">

        <h2>Student Management</h2>

        <input type="text" id="studentName" placeholder="Student Name">
        <input type="email" id="studentEmail" placeholder="Email">
        <input type="text" id="studentPhone" placeholder="Phone">

        <button onclick="addStudent()">Add Student</button>

        <div id="studentList"></div>

    </section>


    <!-- Courses -->
    <section id="courses" class="section">

        <h2>Course Management</h2>

        <input type="text" id="courseName" placeholder="Course Name">

        <select id="courseCategory">
            <option>Technical</option>
            <option>Language</option>
            <option>Non-Technical</option>
        </select>

        <input type="text" id="courseDuration" placeholder="Duration">

        <input type="number" id="courseFee" placeholder="Course Fee">

        <button onclick="addCourse()">Add Course</button>

        <div id="courseList"></div>

    </section>


    <!-- Instructors -->
    <section id="instructors" class="section">

        <h2>Instructor Management</h2>

        <input type="text" id="instructorName" placeholder="Instructor Name">

        <input type="text" id="instructorCode" placeholder="Instructor Code">

        <input type="text" id="instructorExpertise" placeholder="Expertise">

        <button onclick="addInstructor()">Add Instructor</button>

        <div id="instructorList"></div>

    </section>


    <!-- Enrollments -->
    <section id="enrollments" class="section">

        <h2>Enrollment Management</h2>

        <input type="text" id="enrollmentStudent" placeholder="Student Name">

        <input type="text" id="enrollmentCourse" placeholder="Course Name">

        <select id="enrollmentStatus">
            <option>Requested</option>
            <option>Approved</option>
            <option>Rejected</option>
        </select>

        <button onclick="addEnrollment()">Create Enrollment</button>

        <div id="enrollmentList"></div>

    </section>


    <script src="script.js"></script>

</body>
</html>
